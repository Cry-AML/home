# -- Theme Options --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "radix"
defaultAppearance = "light" # valid options: light or dark
autoSwitchAppearance = true

enableA11y = true
enableSearch = false
enableCodeCopy = true
enableStructuredBreadcrumbs = false

replyByEmail = false

disableImageOptimization = false
disableImageOptimizationMD = false
disableTextInHeader = false

hotlinkFeatureImage = false

fingerprintAlgorithm = "sha512"

[header]
  layout = "fixed" # Fixed header bar at top, no floating capsule
  mobileMenuStyle = "dropdown" # valid options: fullscreen, dropdown

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "custom" # Use layouts/partials/home/custom.html
  showRecent = false

[article]
  showDate = false
  showAuthor = true
  showHero = true
  heroStyle = "basic"
  showBreadcrumbs = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = false
  showTableOfContents = true
  showZenMode = false

[list]
  showHero = false
  showBreadcrumbs = false
  showSummary = false
  showCards = true
  orderByWeight = true
  cardView = true
