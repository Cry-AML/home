apply_subject_postdoc: "【博士後應聘】姓名 - 畢業院校/專業"
apply_body_postdoc: |
    尊敬的文卓謙老師：
    
    您好！我關注到您在中山大學中山醫學院組建的白血病表觀遺傳與代謝免疫實驗室正在招收博士後研究人員，特此致信表達強烈的申請意向。
    
    1. 畢業院校與學位：【博士畢業院校、專業及預計/已獲學位時間】
    2. 主要研究方向與專長：【如急性髓系白血病、染色質生物學、代謝重編程、單細胞組學等】
    3. 代表性研究成果：【一作論文發表情況、DOI 或 PMID】
    4. 擬入職時間：【預計可到崗時間】
    
    隨信附上我的個人詳細學術簡歷、研究概述及推薦人聯繫方式。非常期待能有機會向您當面或線上彙報交流。
    
    此致
    敬禮！
    
    申請人：【您的姓名】
    聯繫電話 / 微信：【您的聯繫方式】
    個人主頁 / Google Scholar（如有）：【鏈接】
