about_title: "導師簡介與學術經歷"
about_intro_p1: "文卓謙博士，中山大學中山醫學院副教授、博士生導師，中山大學引進人才、逸仙學者。"
about_intro_p2: "2013 年獲香港大學醫學院血液學博士學位（導師：梁如鴻教授）；2015-2019 年在哈佛大學醫學院/麻省總醫院（MGH）再生醫學中心開展博士後研究（合作導師：David T. Scadden 教授）；2019-2024 年任香港大學研究助理教授；2024 年加盟中山大學中山醫學院組建獨立課題組。"
about_intro_p3: "主要聚焦急性髓系白血病（AML）發生與復發的分子調控網路（表觀修飾、質子穩態與代謝免疫），研發精準聯合靶向方案。成果以通訊或第一作者發表於 Blood、Leukemia、Nature Communications、Haematologica 等國際頂級期刊。"
about_timeline_title: "學術經歷"
btn_view_sysu_profile: "教師主頁"

