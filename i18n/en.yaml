about_title: "Principal Investigator"
about_intro_p1: "Dr. Chi-Hin Man is an Associate Professor and Ph.D. Supervisor at Sun Yat-sen University School of Medicine, supported by the SYSU Yat-sen Scholar Program."
about_intro_p2: "He obtained his Ph.D. in Haematology from HKU in 2013 under Prof. Anskar Leung, completed postdoctoral training at Harvard Medical School / Massachusetts General Hospital (MGH) Center for Regenerative Medicine under Prof. David T. Scadden (2015-2019), served as Research Assistant Professor at HKU (2019-2024), and joined SYSU in 2024 to establish his independent laboratory."
about_intro_p3: "His research decodes the molecular governance of AML initiation, progression, and relapse, with focus on histone modification, intracellular proton homeostasis, and metabolic-immune evasion. Findings have been published in Blood, Leukemia, Nature Communications, and Haematologica."
