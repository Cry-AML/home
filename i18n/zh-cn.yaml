# Join Us auto-filled application mail templates
apply_btn: "申请该岗位 →"
apply_subject_postdoc: "【博士后应聘】姓名 - 毕业院校/专业"
apply_body_postdoc: |
    尊敬的文卓谦老师：
    
    您好！我关注到您在中山大学中山医学院组建的白血病表观遗传与代谢免疫实验室正在招收博士后研究人员，特此致信表达强烈的申请意向。
    
    1. 毕业院校与学位：【博士毕业院校、专业及预计/已获学位时间】
    2. 主要研究方向与专长：【如急性髓系白血病、染色质生物学、代谢重编程、单细胞组学等】
    3. 代表性研究成果：【一作论文发表情况、DOI 或 PMID】
    4. 拟入职时间：【预计可到岗时间】
    
    随信附上我的个人详细学术简历、研究概述及推荐人联系方式。非常期待能有机会向您当面或线上汇报交流。
    
    此致
    敬礼！
    
    申请人：【您的姓名】
    联系电话 / 微信：【您的联系方式】
    个人主页 / Google Scholar（如有）：【链接】
apply_subject_graduate: "【研究生报考咨询】姓名 - 本科院校/专业"
apply_body_graduate: |
    尊敬的文卓谦老师：
    
    您好！我是【当前院校与专业】的学生，对您课题组在白血病恶性演变与转化治疗领域的研究方向非常感兴趣，特此致信咨询【2025/2026】年硕士/博士研究生招收机会。
    
    1. 就读院校与专业：【学校名称、专业名称、在读年级】
    2. 学业成绩与排名：【GPA / 专业排名 / 推免资格情况】
    3. 英语水平：【大学英语六级 / 托福 / 雅思成绩】
    4. 科研经历与成果：【参与课题、大创项目、毕业设计或论文发表情况】
    5. 拟报考类型：【学术型硕士 / 专业型硕士 / 直博生 / 统考博士】
    
    随信附上我的个人简历与本科成绩单。衷心感谢文老师在百忙之中阅读此信！
    
    此致
    敬礼！
    
    学生：【您的姓名】
    联系电话 / 微信：【您的联系方式】
apply_subject_ra: "【科研助理应聘】姓名 - 毕业院校/专业"
