about_title: "导师简介与学术经历"
about_intro_p1: "文卓谦博士，中山大学中山医学院副教授、博士生导师，中山大学引进人才、逸仙学者。"
about_intro_p2: "2013 年获香港大学医学院血液学博士学位（导师：梁如鸿教授）；2015-2019 年在哈佛大学医学院/麻省总医院（MGH）再生医学中心开展博士后研究（合作导师：David T. Scadden 教授）；2019-2024 年任香港大学研究助理教授；2024 年加盟中山大学中山医学院组建独立课题组。"
about_intro_p3: "主要聚焦急性髓系白血病（AML）发生与复发的分子调控网络（表观修饰、质子稳态与代谢免疫），研发精准联合靶向方案。成果以通讯或第一作者发表于 Blood、Leukemia、Nature Communications、Haematologica 等国际顶级期刊。"
about_timeline_title: "学术经历"
btn_view_sysu_profile: "教师主页"

