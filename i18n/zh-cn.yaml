hero_lead: "文卓谦实验室依托中山大学中山医学院，聚焦急性髓系白血病（AML）发生与复发的深层分子机理，深入探索表观修饰重构、质子转运/细胞内pH与代谢重编程的交互调控，致力于从基础分子机制跨越至临床挽救性联合疗法。"
