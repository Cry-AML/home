name: Deploy to GitHub Pages

on:
  push:
    branches: [hugo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build site
        run: |
          if [ -d "themes/blowfish" ]; then
            echo "Building with Hugo + Blowfish theme..."
            hugo --gc --minify
            touch public/.nojekyll
            echo "--- Hugo build complete ---"
            du -sh public
          else
            echo "Staging static site..."
            mkdir -p public
            cp index.html public/
            cp -r assets public/
            touch public/.nojekyll
            echo "--- Static site staged ---"
            du -sh public
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
