{{ define "main" }}
{{ $isEn := eq .Site.Language.Lang "en" }}
{{ $lab := hugo.Data.lab }}

<div class="ui-container py-10 sm:py-14">
  <div class="mb-10">
    <h1 class="ui-title">
      {{ i18n "news_title" }}
    </h1>
  </div>

  <div class="max-w-3xl">
    {{ range $idx, $item := $lab.news }}
      <div class="pedigree-node">
        <span class="pedigree-indicator"></span>
        <span class="ll-badge-neutral mb-1">
          {{ $item.date }}
        </span>
        <h2 class="ui-heading text-neutral-900 dark:text-white mt-1">
          {{ cond $isEn $item.titleEn $item.titleZh }}
        </h2>
        <p class="ui-body text-neutral-700 dark:text-neutral-300 mt-1">
          {{ cond $isEn $item.descEn $item.descZh }}
        </p>
      </div>
    {{ end }}
  </div>
</div>
{{ end }}
