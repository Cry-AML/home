{{ define "main" }}
{{ $isEn := eq .Site.Language.Lang "en" }}
{{ $lab := hugo.Data.lab }}

<div class="ui-container pt-12 pb-20 sm:pt-16">
  <div class="mb-8 ll-measure">
    <h1 class="ui-title">{{ i18n "news_title" }}</h1>
  </div>

  <div class="ll-sheet ll-measure-wide" style="--ll-tilt:-0.18deg; --ll-sheet-i:0">
    {{ range $item := $lab.news }}
      <div class="pedigree-node">
        <span class="pedigree-indicator"></span>
        <span class="ll-stamp ll-stamp--muted">{{ $item.date }}</span>
        <h2 class="ui-heading ll-h-18 mt-2">{{ cond $isEn $item.titleEn $item.titleZh }}</h2>
        <p class="ui-body mt-1.5">{{ cond $isEn $item.descEn $item.descZh }}</p>
      </div>
    {{ end }}
  </div>
</div>
{{ end }}
