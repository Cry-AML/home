<!-- Ambient Living Canvas (Hematopoiesis & Proton Flux Simulator) -->
<canvas id="ambient-canvas" class="fixed inset-0 pointer-events-none -z-20"></canvas>

<!-- Toast Notification for BibTeX Copy -->
<div id="toast-notification" 
     class="hidden fixed bottom-6 right-6 z-[70] bg-neutral-900 text-white dark:bg-neutral-100 dark:text-neutral-900 px-4 py-2.5 rounded-md shadow-sm flex items-center gap-2.5 transition-all duration-250 ease-out opacity-0 translate-y-2 ui-caption font-mono" 
     role="status" 
     aria-live="polite">
  <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
  <span>{{ i18n "toast_copied" }}</span>
</div>

<!-- Figure Showcase Modal -->
<div id="figure-modal" 
     class="hidden fixed inset-0 z-[60] bg-black/70 backdrop-blur-sm items-center justify-center p-4" 
     role="dialog" 
     aria-modal="true" 
     aria-labelledby="figure-modal-title">
  <div class="ui-card max-w-4xl w-full max-h-[90vh] overflow-y-auto flex flex-col p-5 sm:p-6 relative bg-white dark:bg-neutral-900" style="border-width: 0.5px;">
    <div class="flex items-start justify-between pb-3 border-b border-neutral-200 dark:border-neutral-800" style="border-bottom-width: 0.5px;">
      <div>
        <h3 id="figure-modal-title" class="ui-heading">
          {{ i18n "fig_modal_title" }}
        </h3>
      </div>
      <button id="close-figure-modal" 
              onclick="closeFigureModal()" 
              class="ui-btn-sm" 
              aria-label="Close modal">
        &times;
      </button>
    </div>
    
    <div class="my-4 ui-card-inner bg-neutral-950 overflow-hidden flex items-center justify-center" style="border-width: 0.5px;">
      <img src="{{ "images/research-figure-1.jpg" | relURL }}" 
           alt="{{ i18n "fig_thumb_alt" }}" 
           class="max-h-[55vh] w-auto object-contain">
    </div>

    <div class="space-y-2.5 ui-body text-neutral-600 dark:text-neutral-300 border-t border-neutral-200 dark:border-neutral-800 pt-3" style="border-top-width: 0.5px;">
      <p>{{ i18n "fig_panel_a" | safeHTML }}</p>
      <p>{{ i18n "fig_panel_b" | safeHTML }}</p>
    </div>
  </div>
</div>

<!-- Publication Abstract Modal -->
<div id="abstract-modal" 
     class="hidden fixed inset-0 z-[60] bg-black/70 backdrop-blur-sm items-center justify-center p-4" 
     role="dialog" 
     aria-modal="true" 
     aria-labelledby="abstract-modal-title">
  <div class="ui-card max-w-2xl w-full max-h-[85vh] overflow-y-auto flex flex-col p-5 sm:p-6 relative bg-white dark:bg-neutral-900" style="border-width: 0.5px;">
    <div class="flex items-start justify-between pb-3 border-b border-neutral-200 dark:border-neutral-800" style="border-bottom-width: 0.5px;">
      <div class="pr-4">
        <div class="flex items-center gap-2 mb-1">
          <span id="abstract-modal-journal" class="ui-caption font-mono font-semibold text-indigo-600 dark:text-indigo-400"></span>
          <span id="abstract-modal-pmid" class="ui-caption font-mono text-neutral-400"></span>
        </div>
        <h3 id="abstract-modal-title" class="ui-heading leading-snug"></h3>
      </div>
      <button id="close-abstract-modal" 
              onclick="closeAbstractModal()" 
              class="ui-btn-sm flex-shrink-0" 
              aria-label="Close modal">
        &times;
      </button>
    </div>
    
    <div class="mt-4">
      <h4 class="ui-caption font-mono uppercase tracking-wider text-neutral-400 mb-2">Abstract</h4>
      <p id="abstract-modal-text" class="ui-body text-neutral-700 dark:text-neutral-300 text-justify"></p>
    </div>
  </div>
</div>

<!-- Wen Lab Interactive Scripts -->
{{ $script := resources.Get "js/wen-lab.js" }}
{{ if $script }}
  {{ $minified := $script | resources.Minify | resources.Fingerprint }}
  <script src="{{ $minified.RelPermalink }}" integrity="{{ $minified.Data.Integrity }}" defer></script>
{{ end }}
