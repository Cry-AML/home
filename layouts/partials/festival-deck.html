{{/*
  Festival Theme Testing & Simulation Deck
  Fully localized labels per locale (no hardcoded Chinese on English site)
*/}}
{{ $isEn := eq .Site.Language.Lang "en" }}
{{ $isTw := eq .Site.Language.Lang "zh-tw" }}
<details class="ll-fest-deck" id="festival-deck">
  <summary class="ll-fest-pill" title="{{ if $isEn }}Festive Theme Preview{{ else if $isTw }}節日主題效果預覽{{ else }}节日主题效果预览{{ end }}">
    <span aria-hidden="true">🎏</span>
    <span class="ll-fest-title">{{ if $isEn }}Festive Preview{{ else if $isTw }}節日效果預覽{{ else }}节日效果预览{{ end }}</span>
  </summary>
  <div class="ll-fest-menu" role="menu">
    <button type="button" class="ll-fest-btn is-active" data-fest="none" onclick="window.__mchFestival.setOverride('none')">
      <span>{{ if $isEn }}🌱 Standard Logo{{ else if $isTw }}🌱 日常版 (Default){{ else }}🌱 日常版 (Default){{ end }}</span>
    </button>
    <button type="button" class="ll-fest-btn" data-fest="spring" onclick="window.__mchFestival.setOverride('spring')">
      <span>{{ if $isEn }}🧨 Spring Festival{{ else if $isTw }}🧨 春節 (Spring Festival){{ else }}🧨 春节 (Spring Festival){{ end }}</span>
    </button>
    <button type="button" class="ll-fest-btn" data-fest="lantern" onclick="window.__mchFestival.setOverride('lantern')">
      <span>{{ if $isEn }}🏮 Lantern Festival{{ else if $isTw }}🏮 元宵節 (Lantern Festival){{ else }}🏮 元宵节 (Lantern Festival){{ end }}</span>
    </button>
    <button type="button" class="ll-fest-btn" data-fest="qixi" onclick="window.__mchFestival.setOverride('qixi')">
      <span>{{ if $isEn }}🌌 Qixi Festival{{ else if $isTw }}🌌 七夕節 (Qixi / Magpie){{ else }}🌌 七夕节 (Qixi / Magpie){{ end }}</span>
    </button>
    <button type="button" class="ll-fest-btn" data-fest="midautumn" onclick="window.__mchFestival.setOverride('midautumn')">
      <span>{{ if $isEn }}🥮 Mid-Autumn Festival{{ else if $isTw }}🥮 中秋節 (Mid-Autumn){{ else }}🥮 中秋节 (Mid-Autumn){{ end }}</span>
    </button>
    <button type="button" class="ll-fest-btn" data-fest="halloween" onclick="window.__mchFestival.setOverride('halloween')">
      <span>{{ if $isEn }}🎃 Halloween{{ else if $isTw }}🎃 萬聖節 (Halloween){{ else }}🎃 万圣节 (Halloween){{ end }}</span>
    </button>
    <button type="button" class="ll-fest-btn" data-fest="christmas" onclick="window.__mchFestival.setOverride('christmas')">
      <span>{{ if $isEn }}🎄 Christmas{{ else if $isTw }}🎄 聖誕節 (Christmas){{ else }}🎄 圣诞节 (Christmas){{ end }}</span>
    </button>
  </div>
</details>
