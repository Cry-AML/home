{{/*
  Pillar 03 — two agents, one response curve, the synergy point.
    · two capsules angled in from the left
    · arrows converging on a set of axes
    · a response curve (secondary) with the synergy point marked (primary)
*/}}
<svg viewBox="0 0 220 140" fill="none" aria-hidden="true" class="ll-fig">
  <defs>
    <filter id="rough-03" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="3" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#rough-03)" stroke-linecap="round" stroke-linejoin="round">
    <!-- capsule A -->
    <g transform="rotate(22 54 44)">
      <rect x="26" y="31" width="56" height="26" rx="13"
            fill="var(--md-surface-container-high)" stroke="var(--md-outline)" stroke-width="2.4"/>
      <path d="M54 31 V 57" stroke="var(--md-outline)" stroke-width="1.6" opacity="0.28"/>
    </g>
    <!-- capsule B -->
    <g transform="rotate(-22 54 100)">
      <rect x="26" y="87" width="56" height="26" rx="13"
            fill="var(--md-tertiary-container)" stroke="var(--md-outline)" stroke-width="2.4"/>
      <path d="M54 87 V 113" stroke="var(--md-outline)" stroke-width="1.6" opacity="0.28"/>
    </g>

    <!-- convergence -->
    <path d="M90 54 L 122 76" stroke="var(--md-outline)" stroke-width="2.8" opacity="0.8"/>
    <path d="M122 76 L 111 74 M122 76 L 118 65" stroke="var(--md-outline)" stroke-width="2.8" opacity="0.8"/>
    <path d="M90 92 L 122 84" stroke="var(--md-outline)" stroke-width="2.8" opacity="0.8"/>
    <path d="M122 84 L 111 79 M122 84 L 116 91" stroke="var(--md-outline)" stroke-width="2.8" opacity="0.8"/>

    <!-- axes -->
    <path d="M126 122 H 204" stroke="var(--md-outline)" stroke-width="2.6" opacity="0.75"/>
    <path d="M126 122 V 30" stroke="var(--md-outline)" stroke-width="2.6" opacity="0.75"/>

    <!-- response curve -->
    <path d="M132 116 C 148 112, 156 96, 166 80 C 174 68, 186 64, 198 62"
          stroke="var(--md-secondary)" stroke-width="3.6"/>

    <!-- synergy point -->
    <circle cx="180" cy="66" r="17" stroke="var(--md-primary)" stroke-width="2.6" opacity="0.85"/>
    <circle cx="180" cy="66" r="9" fill="var(--md-primary)"/>
  </g>
</svg>
